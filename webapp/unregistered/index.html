<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacarotruck</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script type="module" src="/src/main.ts"></script>

</head>
<body>
    <div x-data="{ loginFormOpen: false, unregisterFormOpen: false }">
        <button @click="loginFormOpen = true">Login</button>

        <div x-show="loginFormOpen" x-transition>
            <form @submit.prevent="handleLogin">
                <input type="text" x-model="username" placeholder="Username" required>
                <input type="password" x-model="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>

        <button @click="unregisterFormOpen = true">Unregister</button>

        <div x-show="unregisterFormOpen" x-transition>
            <form @submit.prevent="handleUnregister">
                <input type="text" x-model="email" placeholder="Email" required>
                <button type="submit">Unregister</button>
            </form>
        </div>
    </div>
    
</body>
</html>
