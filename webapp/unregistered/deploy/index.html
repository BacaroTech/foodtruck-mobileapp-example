<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/bacarotruck/delete/vite.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Bacarotruck</title>
    <script type="module" crossorigin src="/bacarotruck/delete/assets/index-ByGwtmOH.js"></script>
    <link rel="stylesheet" crossorigin href="/bacarotruck/delete/assets/index-ois4cB04.css">
  </head>

  <body class="bg-green-50 mx-5 mt-5">
    <div
      x-data="loginComponent"
    >
      <form x-on:submit.prevent="login" class="flex flex-col items-center">
        <div class="">
          <label
            for="login_email"
            class="block text-sm font-medium leading-6 text-gray-900"
            >Email</label
          >
          <input
            type="email"
            id="login_email"
            x-model="loginEmail"
            placeholder="Enter your email"
            required
            class="block w-full rounded-md border-0 p-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6"
          />

        </div>
        <div>
          <label for="login_password">Password</label>
          <div class="flex flex-col">
            <input
              :type="showPassword ? 'text' : 'password'"
              id="login_password"
              x-model="loginPassword"
              placeholder="Enter your password"
              class="w-full rounded-md border-0 p-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6"
              required
            />
            <span
              x-text="showPassword ? 'Hide' : 'Show'"
              @click="showPassword = !showPassword"
              class="mt-2 w-fit rounded-md bg-blue-500 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500"

              >Show</span
            >
          </div>
        </div>
        <div class="mt-4">
          <button @click="login"
          class="mt-2 w-fit rounded-md bg-green-500 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-green-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-500"
          >Login</button>
        </div>
      </form>

      <template x-if="isLoggedIn">
        <div >
          Sei entrato
          <div class="mt-4">
            <button @click="unregister"
            class="mt-2 w-fit rounded-md bg-green-500 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-green-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-500"
            >Elimina account</button>
          </div>
        </div>
      </template>
    </div>

    
  </body>
</html>
