    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    networks:
      - back
    command: -p 5435
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - app-volume:/var/lib/postgresql/data

